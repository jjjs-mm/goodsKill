spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD:change-me}
    sentinel:
      transport:
        port: 8719
        ## 默认端口8080，已改为自定义18088端口，通过http://127.0.0.1:18088/#/dashboard访问
        dashboard: localhost:18088
  mongodb:
    host: ${MONGODB_HOST:mongo}
    port: ${MONGODB_PORT:27017}

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://zookeeper:2181}

zookeeper_ip: ${ZOOKEEPER_ADDRESS:zookeeper:2181}

## oss配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  accessKey: ${MINIO_ROOT_USER:minioadmin}
  secretKey: ${MINIO_ROOT_PASSWORD:change-me}
  bucketName: ${MINIO_BUCKET_NAME:test}
