server:
  port: 18049

spring:
  profiles:
    active: dev
  #系统名称
  application:
    name: goodskill-common
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
  config:
    import:
      - optional:nacos:goodskill-common-connection.yml
      - optional:nacos:goodskill-common.yml
  main:
    allow-circular-references: true
## dubbo服务注册和发现
dubbo:
  protocol:
    name: tri
    port: -1
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://zookeeper:2181}
  scan:
    base-packages: com.goodskill.common.service.dubbo
  application:
    enable-file-cache: false
    qos-port: 0
#  cloud:
#    subscribed-services: ""


seata:
  enabled: false
  #1.4.2使用此配置禁用seata
  enable-auto-data-source-proxy: false
  application-id: goodskill-common
  tx-service-group: my_test_tx_group
  config:
    type: nacos
    nacos:
      namespace:
      serverAddr: ${NACOS_SERVER_ADDR:nacos:8848}
      group: SEATA_GROUP
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      group: SEATA_GROUP
      namespace:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
